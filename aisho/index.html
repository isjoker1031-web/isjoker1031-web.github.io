<style>
  :root{--bg:#f5f1e8;--paper:#fffdf8;--ink:#2b2620;--soft:#6b6156;--line:#e3dccb;--accent:#c25a6b;--accent-soft:#f0dfe3;--shadow:0 8px 30px rgba(60,45,25,.12)}
  @media(prefers-color-scheme:dark){:root{--bg:#161310;--paper:#201c17;--ink:#eee6d8;--soft:#a99c88;--line:#332c23;--accent:#e59aa8;--accent-soft:#3a2830;--shadow:0 8px 30px rgba(0,0,0,.4)}}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"Hiragino Mincho ProN","Yu Mincho",serif;line-height:1.9;min-height:100vh}
  .wrap{max-width:600px;margin:0 auto;padding:30px 20px 80px}
  .brand{font-size:22px;letter-spacing:.12em;font-weight:600;margin-bottom:18px}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:26px 22px;box-shadow:var(--shadow)}
  h1{font-size:22px;line-height:1.55;margin-bottom:10px}
  .lead{color:var(--soft);font-size:14.5px;margin-bottom:22px}
  label{display:block;font-size:13px;color:var(--soft);margin:14px 0 6px}
  input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:12px 14px;font-family:inherit;font-size:16px}
  input:focus{outline:none;border-color:var(--accent)}
  .btn{display:block;width:100%;background:var(--accent);color:#fff;border:none;border-radius:12px;padding:15px;font-size:16px;font-weight:600;font-family:inherit;letter-spacing:.05em;cursor:pointer;text-align:center;text-decoration:none;margin-top:20px}
  .btn:hover{opacity:.9}
  .ghost{background:none;border:1px solid var(--line);color:var(--soft)}
  .ghost:hover{border-color:var(--accent);color:var(--accent)}
  .pair{text-align:center;color:var(--soft);font-size:15px;margin-bottom:6px}
  .score{text-align:center;font-size:64px;font-weight:600;color:var(--accent);letter-spacing:.02em}
  .score small{font-size:26px}
  .rtitle{text-align:center;font-size:22px;font-weight:600;margin:2px 0 18px}
  .rread{font-size:15.5px;margin-bottom:18px}
  .kv{display:flex;gap:10px;margin:14px 0}
  .kv div{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .kv b{display:block;font-size:12px;color:var(--accent);margin-bottom:4px}
  .kv p{font-size:14px}
  .bridge{background:var(--accent-soft);border-radius:12px;padding:15px 16px;font-size:14px;margin:20px 0}
  .actions{display:flex;gap:10px;margin-top:8px}
  .actions>*{flex:1}
  .small{font-size:13px;padding:12px;margin-top:0}
  .adslot{margin:26px 0}
  .about2{margin-top:34px;color:var(--soft);line-height:1.9}
  .about2 h2{font-size:17px;color:var(--ink);margin-bottom:8px}
  .about2 p{font-size:14px}
  footer{text-align:center;color:var(--soft);font-size:11px;margin-top:40px;font-family:sans-serif}
  footer a{color:var(--soft)}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">ふたりの相性診断</div>

  <div id="intro" class="card">
    <h1>ふたりの相性、占ってみませんか？</h1>
    <p class="lead">二人の名前を入れるだけ。相性のいいところと、ひとことアドバイスもお届けします。無料・登録不要。</p>
    <label>あなたの名前（ニックネームでOK）</label>
    <input id="a" placeholder="例）はると" autocomplete="off">
    <label>お相手の名前</label>
    <input id="b" placeholder="例）ゆい" autocomplete="off">
    <button class="btn" id="go">相性を診断する</button>
    <div id="err" style="color:var(--accent);font-size:13px;margin-top:12px;display:none">お二人の名前を入れてください。</div>
  </div>

  <div id="result" class="card hidden">
    <div class="pair" id="pair"></div>
    <div class="score" id="score"></div>
    <div class="rtitle" id="rtitle"></div>
    <div class="rread" id="rread"></div>
    <div class="kv">
      <div><b>いいところ</b><p id="good"></p></div>
      <div><b>ひとこと</b><p id="advice"></p></div>
    </div>
    <div class="bridge" id="bridge"></div>
    <div class="actions">
      <button class="btn small" id="share">結果をコピー</button>
      <button class="btn ghost small" id="again">別の人と診断</button>
    </div>
  </div>

  <div class="adslot" id="adwrap" style="display:none" data-ad="default">
    
  </div>

  <section class="about2">
    <h2>この相性診断について</h2>
    <p>「ふたりの相性診断」は、二人の名前から相性を占う無料の診断コンテンツです。恋愛はもちろん、友達や家族、気になるあの人との相性も。結果はあくまで楽しむためのものですが、相手を思い浮かべるきっかけになれば幸いです。同じ二人なら何度診断しても同じ結果になります。</p>
  </section>

  <footer>いしはら製作所　·　<a href="/privacy/">プライバシーポリシー</a></footer>
</div>

<script>
const $ = id => document.getElementById(id);
if(localStorage.getItem("moshimo_theme")) document.documentElement.className = localStorage.getItem("moshimo_theme");

const TIERS = [
  {min:90,title:"運命の相性",read:"出会うべくして出会った二人。言葉にしなくても伝わるものがあり、一緒にいる時間を自然体で過ごせる相性です。安心しきってしまう分だけ、当たり前を“ありがとう”に変える意識を忘れずに。",good:"価値観の根っこが似ている",advice:"たまには言葉にして感謝を"},
  {min:75,title:"とても良い相性",read:"テンポが合い、一緒にいて楽しい二人。笑いのツボや心地よい距離感が近く、関係が長続きしやすい相性です。ときどき本音の会話を挟むと、もっと深まります。",good:"一緒にいて疲れない",advice:"すれ違いは早めに話して"},
  {min:60,title:"良い相性",read:"違いもあるけれど、それがちょうどいい刺激になる二人。相手から学べることが多く、お互いを尊重できれば長く続きます。感謝と歩み寄りが鍵になりそうです。",good:"足りない部分を補い合える",advice:"相手のやり方も受け入れてみて"},
  {min:0,title:"これから育つ相性",read:"最初は違いに戸惑うかもしれない二人。でも、時間をかけて分かり合うほど強くなる“育てる相性”です。正反対だからこそ、一人では見えなかった世界を教えてくれます。",good:"一緒にいると視野が広がる",advice:"決めつけず、まず話を聞いて"}
];

function scoreOf(a, b){
  const s = [a, b].sort().join("♡");
  let h = 2166136261;
  for(const ch of s){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; }
  return 40 + (h % 60); // 40〜99
}
function tierOf(sc){ return TIERS.find(t => sc >= t.min); }

function diagnose(){
  const a = $("a").value.trim(), b = $("b").value.trim();
  if(!a || !b){ $("err").style.display = "block"; return; }
  const sc = scoreOf(a, b), t = tierOf(sc);
  $("pair").textContent = `${a} ♡ ${b}`;
  $("score").innerHTML = `${sc}<small>%</small>`;
  $("rtitle").textContent = t.title;
  $("rread").textContent = t.read;
  $("good").textContent = t.good;
  $("advice").textContent = t.advice;
  $("bridge").innerHTML = `もし、${a}さんが${b}さんと出会っていなかったら——？ <a href="/moshimo/" style="color:var(--accent)">“もうひとつの人生”の物語を読む →</a>`;
  window.rtext = `${a} ♡ ${b} の相性は【${sc}%・${t.title}】でした！\nあなたも占ってみて→ https://isjoker1031-web.github.io/aisho/ #相性診断`;
  $("intro").classList.add("hidden");
  $("result").classList.remove("hidden");
  const aw = $("adwrap"); aw.style.display = "block";
  if(window.ishiharaAds) window.ishiharaAds.refresh();
  window.scrollTo({top:0,behavior:"smooth"});
}

$("go").onclick = diagnose;
$("b").addEventListener("keydown", e => { if(e.key === "Enter") diagnose(); });
$("again").onclick = () => { $("result").classList.add("hidden"); $("intro").classList.remove("hidden"); $("err").style.display="none"; window.scrollTo({top:0,behavior:"smooth"}); };
$("share").onclick = () => navigator.clipboard.writeText(window.rtext).then(()=>{ $("share").textContent="コピーしました"; setTimeout(()=>$("share").textContent="結果をコピー",1500); });
</script>
</body>
</html>
